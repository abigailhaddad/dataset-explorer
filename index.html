<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dataset Explorer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%230f6b66%27/%3E%3Cpath d=%27M3 5h10M3 8h10M3 11h6%27 stroke=%27white%27 stroke-width=%271.5%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./">Dataset Explorer</a>
  <nav id="nav" aria-label="Datasets"></nav>
  <button id="theme" type="button" aria-label="Switch light or dark mode">Light/dark</button>
</header>

<main>
  <section id="home" hidden>
    <h1>Datasets</h1>
    <p class="lede">Each one is read straight from its Hugging Face file in your browser. Nothing is copied to this site.</p>
    <ul id="home-list" class="cards"></ul>
  </section>

  <section id="explorer" hidden>
    <h1 id="title"></h1>
    <p id="blurb" class="lede"></p>
    <p id="asof" class="asof"></p>
    <p id="covers" class="covers"></p>
    <details id="about" open>
      <summary>Caveats and sources</summary>
      <ul id="caveats"></ul>
      <p id="links" class="links"></p>
    </details>

    <div id="status" role="status" aria-live="polite"></div>

    <div id="controls" hidden>
      <div class="searchrow">
        <input id="q" type="search" autocomplete="off" aria-label="Search">
        <button id="clear" type="button">Clear filters</button>
        <button id="copy" type="button">Copy link</button>
        <button id="csv" type="button">Download CSV</button>
      </div>
      <div id="filters" class="filters"></div>
      <p id="summary" class="summary"></p>
      <div class="tablewrap">
        <table id="grid"><thead></thead><tbody></tbody></table>
      </div>
      <div class="pager">
        <button id="first" type="button">First</button>
        <button id="prev" type="button">Previous</button>
        <span id="pageinfo"></span>
        <button id="next" type="button">Next</button>
        <button id="last" type="button">Last</button>
      </div>
    </div>
  </section>
</main>

<dialog id="detail">
  <div class="dhead"><h2 id="dtitle"></h2><button id="dclose" type="button" aria-label="Close">Close</button></div>
  <p id="dlinks" class="links"></p>
  <dl id="dbody"></dl>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
